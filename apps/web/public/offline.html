<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网络已断开 · 会记 Minutes</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0A0E1A;
        color: #F0F4F8;
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        background-image: radial-gradient(900px 460px at 12% -10%, rgba(34, 211, 238, 0.14), transparent 60%);
      }
      .card {
        max-width: 22rem;
        padding: 2rem 1.75rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.07);
        -webkit-backdrop-filter: blur(20px);
        backdrop-filter: blur(20px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        text-align: center;
      }
      h1 { font-size: 1.05rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.25rem; font-size: 0.85rem; line-height: 1.6; color: #B8C5D6; }
      button {
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(34, 211, 238, 0.12);
        color: inherit;
        padding: 0.5rem 1rem;
        border-radius: 0.55rem;
        font-size: 0.85rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>没有网络连接</h1>
      <p>会记需要联网读取会议数据。已缓存的页面仍可打开，恢复网络后数据会自动同步。</p>
      <button onclick="location.reload()">重新加载</button>
    </div>
  </body>
</html>
