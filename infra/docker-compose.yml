# 会记 Minutes 本地平台编排
# 用法：cp infra/.env.example .env && docker compose -f infra/docker-compose.yml up -d --build
name: minutes

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minutes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minutes}
      POSTGRES_DB: ${POSTGRES_DB:-minutes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minutes} -d ${POSTGRES_DB:-minutes}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minutes}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minutes-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 建私有桶：拿到 mc 别名后创建桶（幂等）
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minutes} ${MINIO_ROOT_PASSWORD:-minutes-minio-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-minutes} &&
      mc anonymous set none local/${S3_BUCKET:-minutes} &&
      echo 'bucket ready'
      "

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment: &api-env
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://minutes:minutes@postgres:5432/minutes}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-minutes}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minutes}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minutes-minio-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      MINUTES_JWT_SECRET: ${MINUTES_JWT_SECRET:?需要设置 MINUTES_JWT_SECRET}
      MINUTES_ACCESS_TTL: ${MINUTES_ACCESS_TTL:-3600}
      MINUTES_REFRESH_TTL: ${MINUTES_REFRESH_TTL:-2592000}
      MINUTES_ENABLE_RESET: ${MINUTES_ENABLE_RESET:-0}
      MINUTES_LOG_FORMAT: ${MINUTES_LOG_FORMAT:-json}
      MINUTES_LOG_LEVEL: ${MINUTES_LOG_LEVEL:-INFO}
      MINUTES_PIPELINE_SCALE: ${MINUTES_PIPELINE_SCALE:-1}
      MINUTES_STORAGE_DIR: /data/storage
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - apistorage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  # 独立 Worker：消费 Redis 队列，跑转写/摘要并把进度广播回 API（复用 api 镜像）
  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_API_MOCKING: "off"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
  apistorage:
